<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GXPER App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Poppins:wght@400;500;600&display=swap">
<style>/* GXPER app prototype — motion system lifted from the GXPER website build:
   --ease / --spring curves, gradient page wipe with the V mark, lineUp/fadeUp reveals,
   button shine + press, lime ripple, field focus glow, loadbar, spinIn/pop badge, confetti, sparks, toast. */
:root{
  --ink:#0f0d0c; --ink2:#141110; --panel:#1a1716; --lime:#fff400; --fg:#f7f6f5; --muted:#a8a4a1; --dim:#7b7673;
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.21);
  --display:'League Gothic','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --grad:linear-gradient(90deg,#ff0ce1 0%,#ff945d 25%,#ffee06 45%,#d0e950 60%,#8ddac0 80%,#69d2ff 100%);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;
  background:
   radial-gradient(ellipse 40% 50% at 70% 20%,rgba(255,244,0,.07),transparent 70%),
   radial-gradient(ellipse 35% 45% at 15% 90%,rgba(235,0,139,.08),transparent 70%),
   repeating-linear-gradient(90deg,rgba(247,246,245,.025) 0 1px,transparent 1px 120px),
   repeating-linear-gradient(0deg,rgba(247,246,245,.02) 0 1px,transparent 1px 77px),var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
.eyebrow{font:600 11px/1.4 var(--body);letter-spacing:3px;color:var(--lime);text-transform:uppercase}
.d{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.3px}

/* ---------- page layout ---------- */
.stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(260px,330px) 1fr;grid-template-rows:100%}
.panel{height:100%;display:flex;flex-direction:column;gap:22px;padding:34px 10px 28px 36px;min-width:0;animation:fadeUp .9s var(--ease) both}
.brand img{height:30px;width:auto;display:block}
.ttl{margin:0;font:400 54px/.88 var(--display);text-transform:uppercase}
.ttl .ln{display:block;overflow:hidden;padding-bottom:.03em}
.ttl .ln>span{display:block;animation:lineUp 1s var(--ease) both}
.ttl .ln:nth-child(2)>span{animation-delay:.12s;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.now{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(26,23,22,.6)}
.now .k{font:600 10px/1 var(--body);letter-spacing:2.4px;color:var(--muted);text-transform:uppercase}
.now .v{display:block;overflow:hidden;height:30px;margin-top:6px}
.now .v span{display:block;font:400 26px/30px var(--display);text-transform:uppercase;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;transition:transform .45s var(--ease),opacity .3s}
.now .v span.out{transform:translateY(-100%);opacity:0}
.now .bar{height:2px;margin-top:12px;background:var(--line);border-radius:2px;overflow:hidden}
.now .bar i{display:block;height:100%;background:var(--grad);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .5s var(--ease)}
.flows{flex:1;min-height:0;overflow-y:auto;padding-right:18px;margin-right:-4px;scrollbar-width:thin;scrollbar-color:#3a3634 transparent}
.fl{border-top:1px solid var(--line)}
.fl>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 0;text-align:left;font:500 13px/1.2 var(--body)}
.fl>button .no{font:400 18px/1 var(--display);color:var(--dim);width:22px;transition:color .3s}
.fl>button .nm{flex:1}
.fl>button .ct{font:500 11px/1 var(--body);color:var(--dim)}
.fl>button .chev{width:10px;height:10px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .35s var(--ease)}
.fl.open>button .chev{transform:rotate(-135deg) translateX(-3px)}
.fl.cur>button .no,.fl>button:hover .no{color:var(--lime)}
.fl ul{list-style:none;margin:0;padding:0 0 10px 32px;display:none}
.fl.open ul{display:block;animation:fadeUp .45s var(--ease) both}
.fl li button{display:block;width:100%;text-align:left;padding:6px 0;font:400 12px/1.35 var(--body);color:var(--muted);transition:color .2s,transform .3s var(--ease)}
.fl li button:hover{color:var(--fg);transform:translateX(4px)}
.fl li button[aria-current="true"]{color:var(--lime)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);font:600 12px/1 var(--body);transition:border-color .3s,background-color .3s,transform .3s var(--ease)}
.chip:hover{border-color:var(--lime);transform:translateY(-2px)}
.chip:active{transform:translateY(0) scale(.97)}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.chip .kbd{font:500 10px/1 var(--body);padding:3px 5px;border-radius:4px;border:1px solid currentColor;opacity:.6}
.hint{font:400 11.5px/1.55 var(--body);color:var(--dim);margin:0}

.dev{display:grid;place-items:center;height:100vh;height:100dvh;min-width:0;position:relative;overflow:hidden}
.phone{position:absolute;left:50%;top:50%;margin:-426px 0 0 -196.5px;width:393px;height:852px;flex:none;transform:scale(var(--k,1));transform-origin:center;border-radius:56px;
  box-shadow:0 0 0 11px #050404,0 0 0 12.5px #2c2826,0 40px 90px -20px rgba(0,0,0,.9),0 0 120px -30px rgba(255,244,0,.18);
  animation:phoneIn 1.1s var(--ease) both}
@keyframes phoneIn{from{opacity:0;transform:scale(var(--k,1)) translateY(40px)}}
.vp{position:absolute;inset:0;overflow:hidden;border-radius:56px;background:#141110;isolation:isolate;contain:strict}
.island{position:absolute;z-index:90;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;
  display:flex;align-items:center;justify-content:flex-end;padding-right:13px;transition:width .45s var(--spring),margin .45s var(--spring)}
.island i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:blink 2.4s ease-in-out infinite}
.island:hover{width:136px;margin-left:-68px}
@keyframes blink{50%{opacity:.25}}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;overflow:hidden;background:#141110;will-change:transform}
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.sc::-webkit-scrollbar{display:none}
.body{position:relative;width:100%}
.bd{position:absolute;left:0;width:100%}
.bd>span{position:absolute;inset:0;background-image:var(--img);background-size:var(--sw) auto;background-repeat:no-repeat;background-position:0 var(--by)}
.bd.c{overflow:hidden}
.bd.c>span{transition:opacity .75s var(--ease),transform .85s var(--ease),clip-path .95s var(--ease);transition-delay:var(--dl,0s)}
.bd.c.pre>span{opacity:0;transform:translateY(var(--ry,26px))}
.bd.c.big.pre>span{opacity:1;clip-path:inset(0 0 100% 0);transform:translateY(18px)}
.bd.c.soft.pre>span{transform:translateY(12px)}
.fxt,.fxb{position:absolute;left:0;width:100%;z-index:5}
.fxt{top:0}.fxb{bottom:0}
.prog{position:absolute;left:0;right:0;height:2px;z-index:6;background:var(--grad);transform-origin:left;transform:scaleX(var(--p,0));pointer-events:none;box-shadow:0 0 12px rgba(255,140,120,.5);opacity:0;transition:opacity .3s}
.prog.on{opacity:1}

/* hotspots */
.hs{position:absolute;z-index:3;border-radius:10px;-webkit-tap-highlight-color:transparent;transition:background-color .35s,box-shadow .35s;touch-action:manipulation}
.hs.drag{touch-action:pan-y;cursor:grab;z-index:2}
.show-hs .hs,.flash .hs{background:rgba(255,244,0,.14);box-shadow:inset 0 0 0 1.5px rgba(255,244,0,.75)}
.flash .hs{animation:hsFlash .9s ease-out both}
@keyframes hsFlash{0%,55%{background:rgba(255,244,0,.18);box-shadow:inset 0 0 0 1.5px rgba(255,244,0,.85)}100%{background:transparent;box-shadow:inset 0 0 0 1.5px transparent}}

/* press: a slice of the button lifted out and squeezed */
.lift{position:absolute;z-index:4;overflow:hidden;pointer-events:none}
.lift>span{position:absolute;inset:0;background-image:var(--img);background-size:var(--sw) auto;background-repeat:no-repeat;transition:transform .14s var(--ease)}
.lift.down>span{transform:scale(.955)}
.lift.up>span{transition:transform .5s var(--spring)}
.lift .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);mix-blend-mode:overlay}
.lift.shn .shine{animation:shine .7s var(--ease) both}
@keyframes shine{to{transform:translateX(120%)}}
.lift .load{position:absolute;left:8%;bottom:6px;height:3px;width:0;border-radius:3px;background:var(--ink);animation:loadbar .9s var(--ease) forwards}
@keyframes loadbar{to{width:84%}}
.rip{position:absolute;z-index:7;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--lime);pointer-events:none;animation:ripple .75s ease-out forwards}
@keyframes ripple{to{transform:scale(6);opacity:0}}
.focus{position:absolute;z-index:4;border-radius:9px;pointer-events:none;border:1px solid var(--lime);box-shadow:0 0 0 3px rgba(255,244,0,.14),0 0 18px rgba(255,244,0,.18);animation:focusIn .4s var(--ease) both}
.focus::after{content:"";position:absolute;left:39px;top:50%;width:1.5px;height:18px;margin-top:-9px;background:var(--lime);animation:caret 1s steps(1) infinite}
@keyframes focusIn{from{opacity:0;transform:scale(1.03)}}
@keyframes caret{50%{opacity:0}}
.tick{position:absolute;z-index:4;pointer-events:none;border-radius:5px;background:#141110;border:2px solid var(--lime);display:grid;place-items:center;animation:pop .45s var(--spring) both}
.tick svg{width:70%;height:70%}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:check .4s var(--ease) .12s forwards}
.pulse{position:absolute;z-index:4;pointer-events:none;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--lime);animation:pulseOut .7s ease-out forwards}
@keyframes pulseOut{to{opacity:0;transform:scale(1.06)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes check{to{stroke-dashoffset:0}}

/* overlays */
.ov{position:absolute;inset:0;z-index:40}
.ov .shade{position:absolute;inset:0;background:rgba(5,4,4,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.ov .card{position:absolute;background-image:var(--img);background-size:100% 100%;filter:drop-shadow(0 -10px 40px rgba(0,0,0,.6))}
.ov .grab{position:absolute;left:0;right:0;top:0;height:30px;cursor:grab;touch-action:none}

/* wipe — identical to the website's page wipe */
.wipe{position:absolute;inset:0;z-index:80;pointer-events:none;background:var(--grad);transform:scaleX(0);transform-origin:left}
.wipe.go{animation:wipe .9s var(--ease) both}
@keyframes wipe{0%{transform:scaleX(0);transform-origin:left}45%{transform:scaleX(1);transform-origin:left}55%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
.wipe::after{content:"";position:absolute;left:50%;top:50%;width:132px;height:86px;margin:-43px 0 0 -66px;background:url(assets/gxper-v-black.svg) center/contain no-repeat;opacity:0}
.wipe.go::after{animation:wipeMark .9s var(--ease) both}
@keyframes wipeMark{35%,60%{opacity:.9;transform:scale(1)}0%,100%{opacity:0;transform:scale(.6)}}

/* toast */
.toast{position:absolute;left:50%;bottom:44px;z-index:85;transform:translate(-50%,30px);opacity:0;background:var(--lime);color:var(--ink);font:600 13px/normal var(--body);padding:12px 18px;border-radius:12px;white-space:nowrap;transition:transform .5s var(--spring),opacity .3s;pointer-events:none;box-shadow:0 14px 34px -10px rgba(255,244,0,.6)}
.toast.show{transform:translate(-50%,0);opacity:1}

/* screen effects */
.fx{position:absolute;left:0;width:100%;pointer-events:none;z-index:2}
canvas.fx{display:block}
.sweep{background:linear-gradient(105deg,transparent 40%,rgba(255,244,0,.12) 48%,rgba(255,244,0,.02) 52%,transparent 60%);background-size:250% 100%;animation:sweep 6s ease-in-out 1s infinite}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.glowtop{height:300px;top:0;background:radial-gradient(ellipse 60% 70% at 50% 0%,rgba(255,244,0,.22),transparent 70%);mix-blend-mode:screen;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.6}}
.corner{width:260px;height:260px;border-radius:50%;filter:blur(30px);mix-blend-mode:screen;animation:breathe 5s ease-in-out infinite}
.kb>span{animation:kb 2.8s var(--ease) both;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1.07)}}
.popin>span{animation:popIn 1s var(--spring) both;transform-origin:50% 50%}
@keyframes popIn{from{transform:scale(.72);opacity:0;filter:blur(6px)}}
.glow>span{animation:popIn 1s var(--spring) both,markGlow 3s ease-in-out 1.1s infinite}
@keyframes markGlow{50%{filter:drop-shadow(0 0 14px rgba(235,0,139,.45)) drop-shadow(0 0 22px rgba(255,238,6,.25))}}
.spin>span{animation:spinIn 1s var(--ease) both;transform-origin:var(--ox) var(--oy)}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.6);opacity:0}}
.ping{position:absolute;z-index:3;border-radius:50%;border:2px solid #ff945d;pointer-events:none;opacity:0;animation:ping 2.6s ease-out 1s infinite}
.ping.b{animation-delay:2.3s;border-color:#69d2ff}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.1);opacity:0}}
.loader{position:absolute;z-index:3;height:4px;border-radius:4px;background:#2b2826;overflow:hidden}
.loader i{position:absolute;inset:0;background:var(--grad);transform-origin:left;transform:scaleX(0);animation:fill 2.5s var(--ease) .3s forwards}
@keyframes fill{to{transform:scaleX(1)}}

/* drawer (small screens) */
.drawer{position:fixed;inset:0;z-index:300;visibility:hidden}
.drawer .sh{position:absolute;inset:0;background:rgba(5,4,4,.6);opacity:0;transition:opacity .35s}
.drawer .pn{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;gap:16px;background:#1a1716;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:14px 20px max(20px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .5s var(--ease)}
.drawer .pn::before{content:"";align-self:center;width:44px;height:4px;border-radius:4px;background:#3a3634}
.drawer.open{visibility:visible}
.drawer.open .sh{opacity:1}
.drawer.open .pn{transform:none}

@keyframes lineUp{from{transform:translateY(105%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .panel{display:none}
}
@media (max-width:520px){
  .phone{border-radius:0;box-shadow:none}
  .vp{border-radius:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="stage">
  <aside class="panel" aria-label="Prototype controls">
    <a class="brand" href="#" aria-label="GXPER"><img src="assets/gxper-h-gradient.svg" alt="GXPER"></a>
    <div>
      <p class="eyebrow">Motion prototype · App</p>
      <h1 class="ttl"><span class="ln"><span>Play. Earn.</span></span><span class="ln"><span>Rank.</span></span></h1>
    </div>
    <div class="now" aria-live="polite">
      <span class="k" id="nowK">Onboarding</span>
      <span class="v"><span id="nowV">Splash</span></span>
      <div class="bar"><i id="nowBar"></i></div>
    </div>
    <nav class="flows" aria-label="Flows"></nav>
    <div class="ctrls">
      <button class="chip" type="button" data-act="back">← Back <span class="kbd">Esc</span></button>
      <button class="chip" type="button" data-act="hs" aria-pressed="false">Tap areas <span class="kbd">H</span></button>
      <button class="chip" type="button" data-act="restart">Restart <span class="kbd">R</span></button>
    </div>
    <p class="hint">Tap anything in the phone. Tap an empty spot to flash what's clickable. Drag to scroll; swipe the profile card to switch games.</p>
  </aside>
  <main class="dev" id="dev">
    <div class="phone" id="phone">
      <div class="vp" id="vp">
        <button class="island" id="island" type="button" aria-label="Open flows menu"><i></i></button>
        <div class="wipe" id="wipe"></div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </div>
  </main>
</div>
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="sh"></div>
  <div class="pn">
    <p class="eyebrow">GXPER app · flows</p>
    <nav class="flows" aria-label="Flows"></nav>
    <div class="ctrls">
      <button class="chip" type="button" data-act="back">← Back</button>
      <button class="chip" type="button" data-act="hs" aria-pressed="false">Tap areas</button>
      <button class="chip" type="button" data-act="restart">Restart</button>
    </div>
  </div>

}

/* drag-to-swipe between games (Figma "On drag") */
let suppressClick = false;
vp.addEventListener('pointerdown', e => {
  const b = e.target.closest('.hs.drag');
  if (!b || lock) return;
  const x0 = e.clientX, y0 = e.clientY; let dx = 0, active = false;
  const view = b._view;
  const move = ev => {
    dx = (ev.clientX - x0) / K; const dy = (ev.clientY - y0) / K;
    if (!active && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { active = true; b.setPointerCapture(ev.pointerId); }
    if (active) view.body.style.transform = `translateX(${dx * .35}px)`;
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    if (!active) { flash(); return; }
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    if (Math.abs(dx) > 50) { view.body.style.transform = ''; nav(b._h[4].slice(1), {force: dx < 0 ? 'swipeL' : 'swipeR'}); }
    else view.body.animate([{transform: view.body.style.transform}, {transform: 'none'}], {duration: 450, easing: SPRING}).finished.then(() => view.body.style.transform = '');
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});

/* mouse drag scrolling, like a Figma prototype */
function dragScroll(sc) {
  sc.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.hs.drag')) return;
    const y0 = e.clientY, s0 = sc.scrollTop; let moved = false;
    const move = ev => { const dy = (ev.clientY - y0) / K; if (Math.abs(dy) > 5) moved = true; if (moved) sc.scrollTop = s0 - dy; };
    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); if (moved) { suppressClick = true; setTimeout(() => suppressClick = false, 50); if (pressed && pressed.box) pressed.box.remove(); pressed = null; } };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  });
}

/* ---------- panel / drawer ---------- */
const nameCount = {};
const LIST = SECTIONS.map(([k, label, first]) => {
  const ids = Object.keys(S).filter(i => S[i].s === k && !S[i].ov);
  const seen = {};
  return {k, label, first, items: ids.map(i => { const n = S[i].n.replace(/\s+-\s+/g, ' · ').replace(/^login-forgot/, 'Login / forgot'); seen[n] = (seen[n] || 0) + 1; return [i, seen[n] > 1 ? `${n} (${seen[n]})` : n]; })};
});
void nameCount;
function renderFlows(host) {
  host.innerHTML = LIST.map((f, i) => `<div class="fl" data-k="${f.k}"><button type="button" data-first="${f.first}" aria-expanded="false"><span class="no">0${i + 1}</span><span class="nm">${f.label}</span><span class="ct">${f.items.length}</span><span class="chev"></span></button><ul>${f.items.map(([id, n]) => `<li><button type="button" data-go="${id}">${n}</button></li>`).join('')}</ul></div>`).join('');
  host.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) { jump(go.dataset.go); closeDrawer(); return; }
    const hd = e.target.closest('[data-first]');
    if (hd) {
      const fl = hd.parentNode, open = !fl.classList.contains('open');
      $$('.fl', host).forEach(x => { x.classList.remove('open'); x.firstElementChild.setAttribute('aria-expanded', 'false'); });
      if (open) { fl.classList.add('open'); hd.setAttribute('aria-expanded', 'true'); }
    }
  });
}
async function jump(id) {
  if (lock) return;
  if (ov) await closeOverlay(true);
  if (id === cur) return;
  stack = [];
  await show(id, 'wipe');
}
const nowV = $('#nowV'), nowK = $('#nowK'), nowBar = $('#nowBar');
const ORDER = LIST.flatMap(f => f.items.map(x => x[0]));
function panelSync() {
  const id = ov ? ov.id : cur, d = S[id];
  const sec = LIST.find(f => f.k === S[cur].s);
  if (nowK) nowK.textContent = (sec ? sec.label : '') + (ov ? ' · overlay' : '');
  if (nowV) {
    const txt = d.n.replace(/\s+-\s+/g, ' · ').replace(/^login-forgot/, 'Login / forgot');
    if (nowV.textContent !== txt) { nowV.classList.add('out'); setTimeout(() => { nowV.textContent = txt; nowV.classList.remove('out'); }, RM ? 0 : 200); }
  }
  if (nowBar) nowBar.style.setProperty('--p', ((ORDER.indexOf(cur) + 1) / ORDER.length).toFixed(3));
  $$('[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === cur ? 'true' : 'false'));
  $$('.fl').forEach(f => f.classList.toggle('cur', f.dataset.k === S[cur].s));
}
$$('.flows').forEach(renderFlows);
const drawer = $('#drawer');
function openDrawer() { drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); }
function closeDrawer() { drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); }
$('#island').addEventListener('click', e => { e.stopPropagation(); if (innerWidth <= 900) openDrawer(); else flash(); });
$('.drawer .sh').addEventListener('click', closeDrawer);
function toggleHs() {
  showHs = !showHs; vp.classList.toggle('show-hs', showHs);
  $$('[data-act="hs"]').forEach(b => b.setAttribute('aria-pressed', String(showHs)));
}
function restart() { closeDrawer(); stack = []; if (ov) { ov.wrap.remove(); ov = null; } lock = false; show(START, 'wipe'); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'hs') toggleHs();
  if (a.dataset.act === 'back') { closeDrawer(); back(); }
  if (a.dataset.act === 'restart') restart();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'Escape') { if (drawer.classList.contains('open')) closeDrawer(); else if (ov) closeOverlay(); else back(); }
  else if (e.key === 'Backspace' || e.key === 'ArrowLeft') back();
  else if (e.key.toLowerCase() === 'h') toggleHs();
  else if (e.key.toLowerCase() === 'r') restart();
});

/* ---------- boot ---------- */
fit();
addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (S[h] && !S[h].ov && h !== cur) jump(h); });
const deep = decodeURIComponent((location.hash || '').slice(1));
show(S[deep] && !S[deep].ov ? deep : START, 'none');
})();
</script>
